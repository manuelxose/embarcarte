<title id="fdisplay-t">MAREA DISPLAY — proposed identifier (internal, not cleared)</title>
<desc id="fdisplay-d">Proposed MAREA family DISPLAY lockup built from one construction system: territory C symbol + outlined MAREA wordmark + outlined family token. Symbol ink above the baseline equals the 100-unit wordmark cap height; ink-to-ink symbol gap is 0.75 × cap height; 0.5 × cap height clear space is included in the viewBox. PROPOSED / INTERNAL artwork; no trademark clearance.</desc>
