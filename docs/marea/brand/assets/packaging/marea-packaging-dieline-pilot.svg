      <text x="16" y="18.4" font-size="2.4">Dimensiones PROPUESTAS: no proceden de BOM, ingeniería ni proveedor. Sangría 3 mm · área segura 5 mm · líneas de doblez y encolado. Lenguas ES / PT / EN / FR.</text>
