<desc id="lkA-d">Proposed MAREA lockup built from one construction system: territory A symbol + outlined MAREA wordmark. Symbol ink above the baseline equals the 100-unit wordmark cap height; ink-to-ink symbol gap is 0.75 × cap height; 0.5 × cap height clear space is included in the viewBox. PROPOSED / INTERNAL artwork; no trademark clearance.</desc>
