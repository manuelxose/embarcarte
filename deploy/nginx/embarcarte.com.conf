# embarcarte.com detrás de Cloudflare, en un servidor que ya usa nginx (por ejemplo junto a Auctorio).
# Instalar:
#   sudo cp embarcarte.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/embarcarte.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado: Cloudflare → SSL/TLS → Origin Server → Create Certificate (embarcarte.com, *.embarcarte.com),
# guardado en las rutas de abajo, y modo SSL/TLS "Full (strict)".
# Si cambias WEB_PORT en /opt/embarcarte/.env, cambia también el puerto de proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name embarcarte.com www.embarcarte.com;
    return 301 https://embarcarte.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.embarcarte.com;

    ssl_certificate     /etc/ssl/cloudflare/embarcarte.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/embarcarte.com.key;

    return 301 https://embarcarte.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name embarcarte.com;

    ssl_certificate     /etc/ssl/cloudflare/embarcarte.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/embarcarte.com.key;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # URLs canónicas sin barra final.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real del visitante que envía Cloudflare (límites de intentos por IP).
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}
