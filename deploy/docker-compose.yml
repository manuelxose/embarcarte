services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/manuelxose/embarcarte:latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
