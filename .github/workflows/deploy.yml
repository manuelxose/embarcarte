name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:i18n
      - run: npm run test:commerce
      - run: npm run test:seo
      - run: npm run test:backup
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guardar configuración anterior
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: deploy
          key: ${{ secrets.CONTABO_SSH_KEY }}
          fingerprint: ${{ secrets.CONTABO_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/embarcarte
            stamp=$(date +%Y%m%d%H%M%S)
            for file in docker-compose.yml Caddyfile nginx/*.conf; do
              [ ! -f "$file" ] || cp -p "$file" "$file.bak-$stamp"
            done
            container=$(docker compose ps -q web 2>/dev/null || true)
            [ -z "$container" ] || docker inspect --format '{{.Config.Image}}' "$container" > .previous-web-image
      - name: Copiar configuración al servidor
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: deploy
          key: ${{ secrets.CONTABO_SSH_KEY }}
          fingerprint: ${{ secrets.CONTABO_HOST_FINGERPRINT }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/nginx
          target: /opt/embarcarte
          strip_components: 1
      - name: Desplegar
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: deploy
          key: ${{ secrets.CONTABO_SSH_KEY }}
          fingerprint: ${{ secrets.CONTABO_HOST_FINGERPRINT }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/embarcarte
            test -f .env
            export DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export WEB_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 8
            docker compose exec -T web wget -qO- http://127.0.0.1:4000/healthz
            docker compose exec -T web wget -qO- http://127.0.0.1:4000/readyz
            docker compose exec -T web wget -qO /dev/null http://127.0.0.1:4000/
            docker compose exec -T web wget -qO /dev/null http://127.0.0.1:4000/en/shop
            docker compose exec -T web wget -qO /dev/null http://127.0.0.1:4000/sitemap.xml
            docker compose ps
      - name: Smoke test público a través de Caddy/nginx
        run: |
          set -e
          for path in healthz readyz en/shop sitemap.xml; do
            curl -fsS --retry 3 --retry-delay 2 "https://embarcarte.com/$path" > /dev/null
          done
      - name: Restaurar configuración e imagen anterior si falla el smoke
        if: failure()
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: deploy
          key: ${{ secrets.CONTABO_SSH_KEY }}
          fingerprint: ${{ secrets.CONTABO_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/embarcarte
            for file in docker-compose.yml Caddyfile nginx/*.conf; do
              [ ! -f "$file" ] && continue
              latest=$(ls -t "$file".bak-* 2>/dev/null | head -n 1 || true)
              [ -z "$latest" ] || cp -p "$latest" "$file"
            done
            if [ -f .previous-web-image ]; then
              export WEB_IMAGE=$(cat .previous-web-image)
              docker compose pull || true
            fi
            docker compose up -d --remove-orphans
            sleep 8
            docker compose exec -T web wget -qO- http://127.0.0.1:4000/readyz
